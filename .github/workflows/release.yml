name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    # A tag only becomes a release after the same gate every PR passes.
    check:
        uses: ./.github/workflows/ci.yml

    release:
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build extension
              run: bun run build

            - name: Package
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  cd dist
                  zip -r "../x-dm-export-$TAG.zip" . -x "*.DS_Store"
                  cd ..
                  ls -lh "x-dm-export-$TAG.zip"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  files: x-dm-export-${{ github.ref_name }}.zip
                  generate_release_notes: true
                  name: ${{ github.ref_name }}
                  draft: false
                  prerelease: false
